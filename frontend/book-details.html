<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details · SMARTLIB</title>
  <meta name="description" content="Detailed volume information, shelf mapping, reviews, and reservation for SMARTLIB collection.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Book details layout styling */
    .book-details-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: var(--space-10);
      align-items: start;
    }
    .cover-3d-wrapper {
      position: relative;
      border-radius: var(--radius-2xl);
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25), 0 0 0 1px var(--border);
      perspective: 1000px;
      transform-style: preserve-3d;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }
    .cover-3d-wrapper:hover {
      transform: translateY(-8px) rotateY(-4deg) rotateX(2deg);
      box-shadow: 0 30px 60px rgba(109, 40, 217, 0.3), 0 0 0 1px var(--primary-300);
    }
    .cover-3d-img {
      width: 100%;
      height: 440px;
      object-fit: cover;
      display: block;
    }
    .shelf-location-banner {
      background: linear-gradient(135deg, var(--primary-50) 0%, #FFFFFF 100%);
      border: 1.5px solid var(--primary-200);
      border-radius: var(--radius-xl);
      padding: var(--space-5) var(--space-6);
      margin: var(--space-6) 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-4);
      box-shadow: var(--shadow-sm);
    }
    .shelf-breadcrumbs {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      font-weight: var(--font-bold);
      color: var(--primary-900);
      flex-wrap: wrap;
    }
    .shelf-crumb-item {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      background-color: var(--primary-100);
      color: var(--primary-900);
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-sm);
    }
    .review-form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      margin-bottom: var(--space-8);
      box-shadow: var(--shadow-sm);
    }
    .star-selector {
      display: inline-flex;
      gap: var(--space-1);
      cursor: pointer;
      font-size: 1.6rem;
      color: var(--border-dark);
      user-select: none;
    }
    .star-selector .star-btn {
      transition: color var(--transition-fast), transform var(--transition-fast);
      background: none;
      border: none;
      padding: 0;
      color: #CBD5E1;
      font-size: 1.75rem;
      cursor: pointer;
    }
    .star-selector .star-btn.active, .star-selector .star-btn:hover {
      color: #FBBF24;
      transform: scale(1.15);
    }
    .books-scroll-row {
      display: flex;
      gap: var(--space-6);
      overflow-x: auto;
      padding-bottom: var(--space-4);
      scroll-snap-type: x mandatory;
    }
    .books-scroll-row > * {
      flex: 0 0 250px;
      scroll-snap-align: start;
    }
    @media (max-width: 900px) {
      .book-details-grid {
        grid-template-columns: 1fr;
      }
      .cover-3d-img {
        height: 360px;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Collapsible Sidebar (Rendered by navigation.js) -->
    <aside id="sidebar"></aside>

    <div class="main-content">
      <!-- Top Header (Rendered by navigation.js) -->
      <header id="top-header"></header>

      <div class="container-fluid" style="padding-top: var(--space-2);">
        <!-- Breadcrumb -->
        <nav aria-label="Breadcrumb">
          <ul class="breadcrumb" id="detail-breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a><span class="breadcrumb-separator">/</span></li>
            <li class="breadcrumb-item"><a href="books.html">Books</a><span class="breadcrumb-separator">/</span></li>
            <li class="breadcrumb-item active" id="breadcrumb-book-title" aria-current="page">Loading Book...</li>
          </ul>
        </nav>

        <!-- Main Book Detail Content Container -->
        <div id="book-content-container">
          <!-- Loading skeleton state -->
          <div class="card" style="padding: var(--space-8); margin-bottom: var(--space-8);">
            <div class="grid-detail-layout">
              <div class="skeleton" style="height: 420px; border-radius: var(--radius-xl);"></div>
              <div>
                <div class="skeleton skeleton-text title" style="width: 70%; height: 36px; margin-bottom: 12px;"></div>
                <div class="skeleton skeleton-text" style="width: 40%; height: 20px; margin-bottom: 24px;"></div>
                <div class="skeleton skeleton-text" style="height: 80px; margin-bottom: 24px;"></div>
                <div class="skeleton skeleton-text" style="height: 100px;"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Reviews Section -->
        <section class="reviews-section" id="reviews-section" style="display: none;">
          <div class="flex-between flex-wrap gap-4" style="margin-bottom: var(--space-6);">
            <div>
              <h2 class="page-title" style="font-size: var(--text-2xl); margin-bottom: 4px;">Member Reviews</h2>
              <p class="text-sm text-secondary" id="reviews-summary-sub">Loading reader feedback...</p>
            </div>
            <div id="user-review-action"></div>
          </div>

          <!-- Write/Edit Review Form Box (Shown for logged-in members) -->
          <div id="write-review-container" style="display: none;">
            <div class="review-form-card card-enter">
              <h4 class="font-bold text-base" id="review-form-heading" style="margin-bottom: var(--space-3); color: var(--text);">
                Write a Reader Review
              </h4>
              <form id="book-review-form">
                <div class="form-group" style="margin-bottom: var(--space-4);">
                  <label class="form-label">Your Rating <span class="required">*</span></label>
                  <div class="star-selector" id="star-rating-selector" role="radiogroup" aria-label="Rating selector">
                    <button type="button" class="star-btn" data-val="1" aria-label="1 star">★</button>
                    <button type="button" class="star-btn" data-val="2" aria-label="2 stars">★</button>
                    <button type="button" class="star-btn" data-val="3" aria-label="3 stars">★</button>
                    <button type="button" class="star-btn" data-val="4" aria-label="4 stars">★</button>
                    <button type="button" class="star-btn" data-val="5" aria-label="5 stars">★</button>
                  </div>
                  <input type="hidden" id="review-rating-value" name="rating" value="5" />
                </div>

                <div class="form-group">
                  <label for="review-comment" class="form-label">Review Comment <span class="required">*</span></label>
                  <textarea 
                    id="review-comment" 
                    name="comment" 
                    class="form-control form-textarea" 
                    placeholder="Share your thoughts on the content, readability, subject matter, or edition..." 
                    rows="4" 
                    required
                  ></textarea>
                </div>

                <div class="flex-align-center gap-3">
                  <button type="submit" id="submit-review-btn" class="btn btn-primary btn-md">
                    <span>Submit Review</span>
                  </button>
                  <button type="button" id="cancel-review-btn" class="btn btn-ghost btn-md">
                    <span>Cancel</span>
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Reviews List -->
          <div id="reviews-list-container">
            <!-- Populated dynamically -->
          </div>
        </section>

        <!-- Related Books Section -->
        <section class="section-sm" id="related-books-section" style="display: none; border-top: 1px solid var(--border); margin-top: var(--space-10);">
          <div class="flex-between flex-wrap gap-4" style="margin-bottom: var(--space-6);">
            <div>
              <h2 class="page-title" style="font-size: var(--text-2xl); margin-bottom: 4px;">Related Books in Collection</h2>
              <p class="text-sm text-secondary" style="margin: 0;">Readers of this volume also explored these recommendations.</p>
            </div>
            <a href="books.html" class="btn btn-secondary btn-sm">Explore Catalog</a>
          </div>

          <div class="books-scroll-row" id="related-books-row">
            <!-- Rendered by components.bookCard -->
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- REQUIRED SHARED JAVASCRIPT MODULES (IN SPECIFIED ORDER) -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/pagination.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/3d-effects.js"></script>
  <script src="../js/navigation.js"></script>

  <!-- PAGE-SPECIFIC CONTROLLER -->
  <script>
    let currentBookId = null;
    let currentBookData = null;
    let existingUserReviewId = null;

    document.addEventListener('DOMContentLoaded', () => {
      if (window.navigation) window.navigation.init();

      // Read ?id= from URL
      const params = new URLSearchParams(window.location.search);
      currentBookId = params.get('id');

      if (!currentBookId) {
        render404('No book specified in URL parameters.');
        return;
      }

      // Load Book Details, Reviews, and Related Books
      loadBookDetails(currentBookId);
      loadReviews(currentBookId);
      loadRelatedBooks(currentBookId);

      // Setup Review Form & Rating selector
      setupReviewForm();
    });

    /**
     * Fetch Book Details from GET /books/:id
     */
    async function loadBookDetails(id) {
      const container = document.getElementById('book-content-container');
      const titleBreadcrumb = document.getElementById('breadcrumb-book-title');

      try {
        const res = await window.api.get(`/books/${encodeURIComponent(id)}`);
        const book = (res && res.data) ? res.data : res;

        if (!book || (!book.title && !book.book_id && !book.id)) {
          render404('The requested book volume was not found in the catalog.');
          return;
        }

        currentBookData = book;

        // Update Breadcrumb & Document Title
        const title = book.title || 'Untitled Book';
        if (titleBreadcrumb) titleBreadcrumb.textContent = title;
        document.title = `${title} · SMARTLIB`;

        // Shelf location parsing
        const floor = book.floor ?? (book.shelf && book.shelf.floor) ?? 1;
        const section = book.section_name ?? book.section ?? (book.shelf && book.shelf.section) ?? 'General';
        const rack = book.rack_number ?? (book.shelf && book.shelf.rack) ?? 1;
        const shelfNum = book.shelf_number ?? (book.shelf && book.shelf.shelf) ?? 1;
        const shelfId = book.shelf_id ?? (book.shelf && book.shelf.shelf_id) ?? 1;

        const shelfFormatted = `Floor ${floor} &gt; Section ${section} &gt; Rack ${rack} &gt; Shelf ${shelfNum}`;

        // Stock availability
        const available = book.available_copies ?? 0;
        const total = book.total_copies ?? 1;
        const isAvailable = available > 0;
        const author = book.author || 'Unknown Author';
        const category = book.category_name || book.category || 'General';
        const rating = Number(book.avgRating ?? book.rating ?? 0).toFixed(1);
        const reviewCount = book.reviewCount ?? 0;
        const isbn = book.isbn || '—';
        const publisher = book.publisher || 'Academic Press';
        const year = book.publication_year || '—';
        const language = book.language || 'English';
        const pages = book.pages ? `${book.pages} pages` : '—';
        const description = book.description || 'No detailed synopsis available for this publication in library records.';
        const coverImg = book.cover_image;

        const coverHtml = window.format 
          ? window.format.bookCover(coverImg, title) 
          : `<img src="${coverImg || ''}" alt="${title}" class="cover-3d-img" />`;

        container.innerHTML = `
          <div class="card card-enter" style="padding: var(--space-8); margin-bottom: var(--space-8);">
            <div class="book-details-grid">
              <!-- Left: Book Cover 3D -->
              <div class="cover-3d-wrapper">
                ${coverHtml}
              </div>

              <!-- Right: Metadata & Circulation Info -->
              <div class="book-detail-meta">
                <div class="flex-align-center gap-2" style="margin-bottom: var(--space-2);">
                  <span class="badge badge-primary">${category}</span>
                  ${window.format ? window.format.availabilityBadge(available, total) : `<span class="badge badge-available">${available}/${total} Available</span>`}
                </div>

                <h1 class="book-detail-title">${title}</h1>
                <p class="book-detail-author">by <strong style="color: var(--text);">${author}</strong></p>

                <!-- Rating -->
                <div class="flex-align-center gap-3" style="margin-bottom: var(--space-6);">
                  ${window.format ? window.format.starRating(rating) : `<span>★ ${rating}</span>`}
                  <span class="text-xs text-muted">(${reviewCount} reader reviews)</span>
                </div>

                <!-- Shelf Location Banner -->
                <div class="shelf-location-banner">
                  <div class="flex-col">
                    <span class="text-xs text-muted" style="text-transform: uppercase; font-weight: var(--font-bold); letter-spacing: 0.05em; margin-bottom: 4px;">
                      Physical Shelf Location
                    </span>
                    <div class="shelf-breadcrumbs">
                      <span class="shelf-crumb-item">Floor ${floor}</span>
                      <span>›</span>
                      <span class="shelf-crumb-item">Sec ${section}</span>
                      <span>›</span>
                      <span class="shelf-crumb-item">Rack ${rack}</span>
                      <span>›</span>
                      <span class="shelf-crumb-item">Shelf ${shelfNum}</span>
                    </div>
                  </div>
                  <a href="library-map.html?shelf=${encodeURIComponent(shelfId)}" class="btn btn-secondary btn-sm" style="background: var(--surface);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>
                    <span>Show on Library Map</span>
                  </a>
                </div>

                <!-- Primary Circulation Actions -->
                <div class="flex-align-center gap-4 flex-wrap" style="margin-bottom: var(--space-6);">
                  <button id="detail-reserve-btn" class="btn ${isAvailable ? 'btn-primary' : 'btn-secondary'} btn-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                    <span>${isAvailable ? 'Borrow / Reserve Copy' : 'Place on Hold (Waitlist)'}</span>
                  </button>
                  <span class="text-sm font-semibold" style="color: ${isAvailable ? 'var(--success)' : 'var(--danger)'};">
                    ${isAvailable ? `${available} of ${total} copies currently available` : 'All copies are currently borrowed'}
                  </span>
                </div>

                <!-- Description Paragraph -->
                <div style="margin-bottom: var(--space-6);">
                  <h4 class="font-bold text-sm" style="margin-bottom: var(--space-2); color: var(--text);">Overview &amp; Synopsis</h4>
                  <p class="text-sm" style="color: var(--text-secondary); line-height: var(--leading-relaxed); margin-bottom: 0;">
                    ${description}
                  </p>
                </div>

                <!-- Specification Meta Grid -->
                <div class="book-meta-grid">
                  <div class="book-meta-item">
                    <span class="book-meta-label">ISBN</span>
                    <span class="book-meta-val">${isbn}</span>
                  </div>
                  <div class="book-meta-item">
                    <span class="book-meta-label">Publisher</span>
                    <span class="book-meta-val">${publisher}</span>
                  </div>
                  <div class="book-meta-item">
                    <span class="book-meta-label">Publication Year</span>
                    <span class="book-meta-val">${year}</span>
                  </div>
                  <div class="book-meta-item">
                    <span class="book-meta-label">Language</span>
                    <span class="book-meta-val">${language}</span>
                  </div>
                  <div class="book-meta-item">
                    <span class="book-meta-label">Total Pages</span>
                    <span class="book-meta-val">${pages}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        // Bind Detail Reservation Button
        const reserveBtn = document.getElementById('detail-reserve-btn');
        if (reserveBtn) {
          reserveBtn.addEventListener('click', handleDetailReserve);
        }

        // Show reviews section
        const reviewsSec = document.getElementById('reviews-section');
        if (reviewsSec) reviewsSec.style.display = 'block';

      } catch (err) {
        console.error('Failed to load book details:', err);
        render404('Error retrieving book volume from library servers.');
      }
    }

    /**
     * Handle Book Reservation
     */
    async function handleDetailReserve() {
      if (!window.auth || !window.auth.isAuthenticated()) {
        if (window.toast) window.toast.warning('Please sign in to place a book reservation.');
        setTimeout(() => {
          window.location.href = `login.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}`;
        }, 1200);
        return;
      }

      const confirmed = await window.modal.confirm(
        'Confirm Book Reservation',
        'Would you like to lock this book under your student or faculty membership account?'
      );

      if (!confirmed) return;

      const btn = document.getElementById('detail-reserve-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Processing Reservation...</span>';
      }

      try {
        await window.api.post('/reservations', { book_id: currentBookId });
        if (window.toast) {
          window.toast.success('Reservation successfully confirmed! We will notify you when ready.');
        }
        if (btn) {
          btn.innerHTML = '<span>Reserved</span>';
          btn.classList.replace('btn-primary', 'btn-secondary');
        }
      } catch (err) {
        console.error('Reservation failed:', err);
        const msg = err.message || 'Unable to place reservation at this time.';
        if (window.toast) window.toast.error(msg);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<span>Borrow / Reserve Copy</span>';
        }
      }
    }

    /**
     * Load Book Reviews from GET /reviews/book/:id
     */
    async function loadReviews(bookId) {
      const listContainer = document.getElementById('reviews-list-container');
      const summarySub = document.getElementById('reviews-summary-sub');
      const actionContainer = document.getElementById('user-review-action');
      if (!listContainer) return;

      try {
        const res = await window.api.get(`/reviews/book/${encodeURIComponent(bookId)}`);
        const reviews = (res && res.data) ? res.data : (Array.isArray(res) ? res : []);

        if (summarySub) {
          summarySub.textContent = `${reviews.length} total reader review${reviews.length === 1 ? '' : 's'}`;
        }

        // Check if current user is logged in
        const user = window.auth ? window.auth.getUser() : null;
        if (user && actionContainer) {
          // Check if user already reviewed
          const userReview = reviews.find(r => (r.user_id && r.user_id === user.user_id) || (r.user && r.user.email === user.email));
          if (userReview) {
            existingUserReviewId = userReview.id || userReview._id || userReview.review_id;
            actionContainer.innerHTML = `
              <button class="btn btn-secondary btn-sm" id="toggle-review-form-btn">
                <span>Edit Your Review</span>
              </button>
            `;
            // Pre-fill form
            prefillReviewForm(userReview);
          } else {
            actionContainer.innerHTML = `
              <button class="btn btn-primary btn-sm" id="toggle-review-form-btn">
                <span>Write a Review</span>
              </button>
            `;
          }

          const toggleBtn = document.getElementById('toggle-review-form-btn');
          if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
              const formBox = document.getElementById('write-review-container');
              if (formBox) {
                const isHidden = formBox.style.display === 'none';
                formBox.style.display = isHidden ? 'block' : 'none';
                if (isHidden) formBox.scrollIntoView({ behavior: 'smooth' });
              }
            });
          }
        }

        if (!reviews.length) {
          listContainer.innerHTML = `
            <div style="background: var(--surface); padding: var(--space-8); border-radius: var(--radius-xl); border: 1px solid var(--border); text-align: center;">
              <p class="text-sm text-secondary" style="margin: 0;">No reviews written yet. Be the first reader to share your thoughts!</p>
            </div>
          `;
          return;
        }

        listContainer.innerHTML = reviews.map(r => window.components.reviewCard(r)).join('');

      } catch (err) {
        console.warn('Could not load reviews', err);
        listContainer.innerHTML = `
          <div style="background: var(--surface); padding: var(--space-6); border-radius: var(--radius-xl); border: 1px solid var(--border); text-align: center;">
            <p class="text-sm text-secondary" style="margin: 0;">Reader reviews could not be loaded at this time.</p>
          </div>
        `;
      }
    }

    /**
     * Setup Star Rating Selector & Form
     */
    function setupReviewForm() {
      const starContainer = document.getElementById('star-rating-selector');
      const ratingInput = document.getElementById('review-rating-value');
      const form = document.getElementById('book-review-form');
      const cancelBtn = document.getElementById('cancel-review-btn');
      const formBox = document.getElementById('write-review-container');

      if (!starContainer || !ratingInput || !form) return;

      const starButtons = starContainer.querySelectorAll('.star-btn');

      const updateStars = (val) => {
        ratingInput.value = val;
        starButtons.forEach(btn => {
          const btnVal = Number(btn.getAttribute('data-val'));
          btn.classList.toggle('active', btnVal <= val);
        });
      };

      // Default 5 stars
      updateStars(5);

      starButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const val = Number(btn.getAttribute('data-val'));
          updateStars(val);
        });
      });

      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          if (formBox) formBox.style.display = 'none';
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const rating = parseInt(ratingInput.value, 10);
        const comment = form.comment.value.trim();

        if (!comment) {
          if (window.toast) window.toast.warning('Please write a short comment for your review.');
          return;
        }

        const submitBtn = document.getElementById('submit-review-btn');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span>Publishing...</span>';
        }

        try {
          const payload = {
            book_id: currentBookId,
            rating: rating,
            comment: comment
          };

          if (existingUserReviewId) {
            await window.api.put(`/reviews/${existingUserReviewId}`, payload);
            if (window.toast) window.toast.success('Your review has been updated!');
          } else {
            await window.api.post('/reviews', payload);
            if (window.toast) window.toast.success('Thank you! Your review was published.');
          }

          if (formBox) formBox.style.display = 'none';
          loadReviews(currentBookId);
        } catch (err) {
          console.error('Review submit failed:', err);
          const msg = err.message || 'Unable to submit review. Please try again.';
          if (window.toast) window.toast.error(msg);
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Submit Review</span>';
          }
        }
      });
    }

    function prefillReviewForm(review) {
      const form = document.getElementById('book-review-form');
      const heading = document.getElementById('review-form-heading');
      const ratingInput = document.getElementById('review-rating-value');
      const starContainer = document.getElementById('star-rating-selector');

      if (!form) return;
      if (heading) heading.textContent = 'Edit Your Review';
      if (form.comment) form.comment.value = review.comment || review.content || '';

      const rating = review.rating || 5;
      if (ratingInput) ratingInput.value = rating;

      if (starContainer) {
        starContainer.querySelectorAll('.star-btn').forEach(btn => {
          const btnVal = Number(btn.getAttribute('data-val'));
          btn.classList.toggle('active', btnVal <= rating);
        });
      }
    }

    /**
     * Load Related Books from GET /books/:id/related
     */
    async function loadRelatedBooks(bookId) {
      const section = document.getElementById('related-books-section');
      const row = document.getElementById('related-books-row');
      if (!section || !row) return;

      try {
        const res = await window.api.get(`/books/${encodeURIComponent(bookId)}/related`);
        const books = (res && res.data) ? res.data : (Array.isArray(res) ? res : []);

        if (!books.length) return;

        section.style.display = 'block';
        row.innerHTML = books.map(b => window.components.bookCard(b)).join('');

        if (window.effects) window.effects.initTiltEffect('.book-card-3d');
      } catch (err) {
        console.warn('Could not load related books', err);
      }
    }

    /**
     * 404 Book Not Found Handler
     */
    function render404(msg = 'The requested book was not found.') {
      const container = document.getElementById('book-content-container');
      const breadcrumb = document.getElementById('breadcrumb-book-title');

      if (breadcrumb) breadcrumb.textContent = 'Not Found';
      document.title = 'Book Not Found · SMARTLIB';

      if (container) {
        container.innerHTML = window.components.emptyState(
          'alert',
          'Book Not Found',
          msg,
          'Return to Book Catalog',
          'books.html'
        );
      }
    }
  </script>
</body>
</html>
