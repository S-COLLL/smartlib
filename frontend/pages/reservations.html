<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reservations · SMARTLIB</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .reservation-card {
      background-color: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      padding: var(--space-6);
      box-shadow: var(--shadow-sm);
      display: flex;
      gap: var(--space-6);
      transition: all var(--transition-base);
      position: relative;
    }
    .reservation-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .res-card-cover {
      width: 95px;
      height: 138px;
      border-radius: var(--radius-md);
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
    }
    .res-card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .queue-indicator {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-full);
      background-color: var(--primary-50);
      color: var(--primary-800);
      font-size: var(--text-xs);
      font-weight: var(--font-bold);
      border: 1px solid var(--primary-200);
      width: fit-content;
    }
    .table-res-cover {
      width: 36px;
      height: 50px;
      border-radius: var(--radius-xs);
      overflow: hidden;
      flex-shrink: 0;
    }
    .table-res-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @media (max-width: 640px) {
      .reservation-card {
        flex-direction: column;
      }
      .res-card-cover {
        width: 80px;
        height: 116px;
      }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Header -->
      <header class="top-header" id="top-header"></header>

      <!-- Page Header -->
      <div class="page-header">
        <div class="page-title-group">
          <ul class="breadcrumb" aria-label="Breadcrumb">
            <li class="breadcrumb-item"><a href="/pages/member-dashboard.html">Dashboard</a></li>
            <li class="breadcrumb-separator">/</li>
            <li class="breadcrumb-item active" aria-current="page">My Reservations</li>
          </ul>
          <h1 class="page-title">My Reservations</h1>
          <p class="page-subtitle">Track your book hold requests, waitlist queue positions, and past reservation history.</p>
        </div>
        <div class="page-actions">
          <a href="/pages/books.html" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span>Search & Reserve Books</span>
          </a>
        </div>
      </div>

      <!-- Segmented Tab Navigation -->
      <div class="flex-between flex-wrap gap-4" style="margin-bottom: var(--space-6);">
        <div class="tabs" role="tablist">
          <button class="tab active" id="tab-btn-active" role="tab" aria-selected="true" aria-controls="panel-active">
            <span>Active Reservations</span>
            <span class="count badge badge-primary" id="active-res-count">0</span>
          </button>
          <button class="tab" id="tab-btn-history" role="tab" aria-selected="false" aria-controls="panel-history">
            <span>Reservation History</span>
            <span class="count badge badge-secondary" id="history-res-count">0</span>
          </button>
        </div>
      </div>

      <!-- Tab 1: Active Reservations Tab Panel -->
      <section id="panel-active" role="tabpanel" aria-labelledby="tab-btn-active">
        <div id="active-reservations-list" class="flex-col gap-5">
          <!-- Loading skeleton -->
          <div class="skeleton-card">
            <div class="flex gap-4">
              <div class="skeleton skeleton-image" style="width: 95px; height: 138px;"></div>
              <div class="flex-col flex-1">
                <div class="skeleton skeleton-text title" style="width: 45%;"></div>
                <div class="skeleton skeleton-text short" style="width: 30%;"></div>
                <div class="skeleton skeleton-text" style="height: 40px; margin-top: 14px;"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Tab 2: Reservation History Tab Panel -->
      <section id="panel-history" role="tabpanel" aria-labelledby="tab-btn-history" style="display: none;">
        <div class="table-container">
          <table class="table table-hover" id="res-history-table">
            <thead>
              <tr>
                <th>Book Title</th>
                <th>Author</th>
                <th>Reserved Date</th>
                <th>Fulfilled / Closed Date</th>
                <th>Final Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="res-history-table-body">
              <tr>
                <td colspan="6" style="text-align: center; padding: var(--space-8);">
                  <div class="spinner spinner-md"></div>
                  <p class="text-xs text-muted" style="margin-top: 8px;">Loading reservation history...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- History Pagination -->
        <div id="res-history-pagination"></div>
      </section>
    </main>
  </div>

  <!-- Shared JS Modules -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/pagination.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/3d-effects.js"></script>
  <script src="../js/navigation.js"></script>

  <!-- Page Specific Script -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Guard route
      if (!window.auth || !window.auth.requireAuth(['member'])) {
        return;
      }

      // 2. Navigation init
      if (window.navigation) {
        window.navigation.init();
      }

      // 3. Tab Management
      const tabActive = document.getElementById('tab-btn-active');
      const tabHistory = document.getElementById('tab-btn-history');
      const panelActive = document.getElementById('panel-active');
      const panelHistory = document.getElementById('panel-history');

      let historyLoaded = false;

      tabActive.addEventListener('click', () => {
        tabActive.classList.add('active');
        tabActive.setAttribute('aria-selected', 'true');
        tabHistory.classList.remove('active');
        tabHistory.setAttribute('aria-selected', 'false');
        panelActive.style.display = 'block';
        panelHistory.style.display = 'none';
      });

      tabHistory.addEventListener('click', () => {
        tabHistory.classList.add('active');
        tabHistory.setAttribute('aria-selected', 'true');
        tabActive.classList.remove('active');
        tabActive.setAttribute('aria-selected', 'false');
        panelHistory.style.display = 'block';
        panelActive.style.display = 'none';
        if (!historyLoaded) {
          loadHistoryReservations();
        }
      });

      // 4. Load Active Reservations
      async function loadActiveReservations() {
        const container = document.getElementById('active-reservations-list');
        try {
          const res = await window.api.get('/reservations/my');
          const allRes = res.data || res || [];

          // Partition into active vs history
          const activeList = allRes.filter(r => (r.status || 'pending').toLowerCase() === 'pending' || (r.status || '').toLowerCase() === 'ready');
          const historyList = allRes.filter(r => (r.status || '').toLowerCase() !== 'pending' && (r.status || '').toLowerCase() !== 'ready');

          document.getElementById('active-res-count').textContent = String(activeList.length);
          document.getElementById('history-res-count').textContent = String(historyList.length);

          if (activeList.length === 0) {
            container.innerHTML = window.components.emptyState(
              'calendar',
              'No Active Reservations',
              'You currently do not have any books placed on hold. If a book you want is checked out, you can reserve it from the catalog.',
              'Browse Book Catalog',
              '/pages/books.html'
            );
            return;
          }

          let html = '';
          activeList.forEach(r => {
            const id = r.id || r.reservation_id;
            const bookId = r.book_id || r.bookId || '';
            const title = r.title || r.book_title || 'Untitled Book';
            const author = r.author || r.book_author || 'Unknown Author';
            const cover = r.cover_image || r.book_cover || null;
            const position = r.queue_position || 1;
            const reserveDate = window.format ? window.format.date(r.reservation_date || r.created_at) : '—';
            const expiryDate = r.expiry_date ? (window.format ? window.format.date(r.expiry_date) : r.expiry_date) : 'Standard 14 Days';
            const status = (r.status || 'pending').toUpperCase();

            const coverEl = window.format ? window.format.bookCover(cover, title) : `<img src="${cover || ''}" alt="${title}" />`;
            const statusBadge = window.format ? window.format.statusBadge(status) : `<span class="badge badge-warning">${status}</span>`;

            html += `
              <div class="reservation-card" data-res-id="${id}">
                <div class="res-card-cover">${coverEl}</div>
                <div class="flex-col flex-1" style="min-width: 0;">
                  <div class="flex-between flex-wrap gap-2">
                    <div>
                      <h3 class="text-lg font-bold" style="margin-bottom: 2px;">
                        <a href="/pages/book-details.html?id=${bookId}" style="color: inherit; text-decoration: none;">${title}</a>
                      </h3>
                      <p class="text-sm text-secondary" style="margin-bottom: 0;">by ${author}</p>
                    </div>
                    <div>${statusBadge}</div>
                  </div>

                  <div style="margin: var(--space-3) 0;">
                    <div class="queue-indicator">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                      <span>Position #${position} in queue</span>
                    </div>
                  </div>

                  <div class="flex-align-center gap-4 text-xs text-muted" style="margin-bottom: var(--space-4);">
                    <span>Reserved on: <strong>${reserveDate}</strong></span>
                    <span>Hold Expires: <strong>${expiryDate}</strong></span>
                  </div>

                  <div class="flex-between flex-wrap gap-3" style="margin-top: auto; padding-top: var(--space-2); border-top: 1px solid var(--border-light);">
                    <span class="text-xs text-secondary">
                      You will be notified immediately when a copy is returned for you.
                    </span>
                    <div class="flex-align-center gap-2">
                      <a href="/pages/book-details.html?id=${bookId}" class="btn btn-secondary btn-sm">Book Info</a>
                      <button class="btn btn-danger btn-sm cancel-res-action-btn" data-id="${id}">
                        <span>Cancel Reservation</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          });

          container.innerHTML = html;

          // Wire cancel actions
          container.querySelectorAll('.cancel-res-action-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const resId = btn.getAttribute('data-id');
              const confirmed = await window.modal.confirm(
                'Cancel Hold Request?',
                'Are you sure you want to cancel this reservation? If you change your mind later, you will lose your current spot in the queue.',
                { confirmClass: 'btn-danger', confirmText: 'Yes, Cancel Hold' }
              );
              if (!confirmed) return;

              btn.disabled = true;
              btn.innerHTML = '<span class="spinner spinner-sm"></span> Cancelling...';

              try {
                await window.api.put(`/reservations/${resId}/cancel`, {});
                window.toast.success('Your reservation was successfully cancelled.', 'Hold Cancelled');
                loadActiveReservations();
              } catch (err) {
                window.toast.error(err.message || 'Failed to cancel reservation.', 'Cancellation Failed');
                btn.disabled = false;
                btn.textContent = 'Cancel Reservation';
              }
            });
          });
        } catch (err) {
          console.error('Error loading active reservations:', err);
          container.innerHTML = `
            <div class="card p-6 text-center">
              <p class="text-danger font-semibold">Unable to load reservations: ${err.message || 'Server error'}</p>
              <button class="btn btn-secondary btn-sm" onclick="location.reload()">Retry</button>
            </div>
          `;
        }
      }

      // 5. Load History Reservations
      let currentHistoryPage = 1;
      const historyPageSize = 8;

      async function loadHistoryReservations(page = 1) {
        currentHistoryPage = page;
        const tbody = document.getElementById('res-history-table-body');
        const paginationContainer = document.getElementById('res-history-pagination');

        try {
          const res = await window.api.get('/reservations/my');
          const allRes = res.data || res || [];
          const historyList = allRes.filter(r => (r.status || '').toLowerCase() !== 'pending' && (r.status || '').toLowerCase() !== 'ready');

          document.getElementById('history-res-count').textContent = String(historyList.length);
          historyLoaded = true;

          if (historyList.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="6" style="padding: 0; border: none;">
                  ${window.components.emptyState('calendar', 'No Past Reservations', 'You have no fulfilled or cancelled reservations.')}
                </td>
              </tr>
            `;
            paginationContainer.innerHTML = '';
            return;
          }

          // Sort descending by date
          historyList.sort((a, b) => new Date(b.updated_at || b.reservation_date || 0) - new Date(a.updated_at || a.reservation_date || 0));

          // Slice for pagination
          const total = historyList.length;
          const totalPages = Math.ceil(total / historyPageSize) || 1;
          const start = (page - 1) * historyPageSize;
          const pagedItems = historyList.slice(start, start + historyPageSize);

          let html = '';
          pagedItems.forEach(r => {
            const bookId = r.book_id || r.bookId || '';
            const title = r.title || r.book_title || 'Untitled Book';
            const author = r.author || r.book_author || 'Unknown Author';
            const cover = r.cover_image || r.book_cover || null;
            const reserveDate = window.format ? window.format.date(r.reservation_date || r.created_at) : '—';
            const closedDate = window.format ? window.format.date(r.fulfilled_at || r.updated_at || r.expiry_date) : '—';
            const status = (r.status || 'CANCELLED').toUpperCase();

            let statusBadge = `<span class="badge badge-secondary">${status}</span>`;
            if (status === 'FULFILLED') {
              statusBadge = `<span class="badge badge-success"><span class="badge-dot"></span>FULFILLED</span>`;
            } else if (status === 'CANCELLED') {
              statusBadge = `<span class="badge badge-danger"><span class="badge-dot"></span>CANCELLED</span>`;
            } else if (status === 'EXPIRED') {
              statusBadge = `<span class="badge badge-warning"><span class="badge-dot"></span>EXPIRED</span>`;
            }

            const coverEl = window.format ? window.format.bookCover(cover, title) : `<img src="${cover || ''}" alt="${title}" />`;

            html += `
              <tr>
                <td>
                  <div class="flex-align-center gap-3">
                    <div class="table-res-cover">${coverEl}</div>
                    <span class="font-bold text-sm" style="color: var(--text);">${title}</span>
                  </div>
                </td>
                <td class="text-sm text-secondary">${author}</td>
                <td class="text-xs text-muted">${reserveDate}</td>
                <td class="text-xs text-muted">${closedDate}</td>
                <td>${statusBadge}</td>
                <td>
                  <a href="/pages/book-details.html?id=${bookId}" class="btn btn-ghost btn-sm">Details</a>
                </td>
              </tr>
            `;
          });

          tbody.innerHTML = html;

          if (window.pagination) {
            window.pagination.render(paginationContainer, {
              currentPage: page,
              totalPages,
              onPageChange: (newPage) => loadHistoryReservations(newPage)
            });
          }
        } catch (err) {
          console.error('Error loading history reservations:', err);
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align:center; color: var(--danger); padding: var(--space-6);">
                Failed to load past reservations: ${err.message || 'Server error'}
              </td>
            </tr>
          `;
        }
      }

      // Initial load
      loadActiveReservations();
    });
  </script>
</body>
</html>
