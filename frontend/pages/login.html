<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · SMARTLIB</title>
  <meta name="description" content="Sign in to your SMARTLIB account to access your library dashboard, reserve books, and track loans.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Specific styles for login */
    .demo-accounts {
      margin-top: var(--space-6);
      padding-top: var(--space-5);
      border-top: 1px dashed var(--border);
    }
    .demo-account-chip {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.35rem 0.65rem;
      font-size: var(--text-xs);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
    }
    .demo-account-chip:hover {
      background: var(--primary-50);
      color: var(--primary-800);
      border-color: var(--primary-300);
      transform: translateY(-1px);
    }
    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--accent-light);
      text-decoration: none;
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      transition: color var(--transition-fast);
    }
    .back-home-link:hover {
      color: #FFFFFF;
    }
  </style>
</head>
<body class="auth-page">

  <!-- Background decorative floating orbs -->
  <div class="hero-glow-orb" style="top: -120px; left: -100px;"></div>
  <div class="hero-glow-orb-secondary" style="bottom: -150px; right: -80px;"></div>

  <div class="auth-container">
    <a href="index.html" class="back-home-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      <span>Back to Home</span>
    </a>

    <div class="auth-card card-enter">
      <div class="auth-header">
        <a href="index.html" class="auth-logo-badge" title="SMARTLIB Home">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 2v20"/></svg>
        </a>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to manage your borrowings, track shelves, and discover books.</p>
      </div>

      <form id="login-form" novalidate>
        <!-- Email Input -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address <span class="required">*</span></label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-control" 
              placeholder="name@university.edu" 
              autocomplete="email"
              required 
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <div class="flex-between" style="margin-bottom: var(--space-2);">
            <label for="password" class="form-label" style="margin-bottom: 0;">Password <span class="required">*</span></label>
          </div>
          <div class="input-with-icon input-with-icon-right">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="••••••••" 
              autocomplete="current-password"
              required 
            />
            <button type="button" class="input-icon-right" id="toggle-password-btn" aria-label="Toggle password visibility" style="background: none; border: none;">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex-between flex-wrap gap-2" style="margin-bottom: var(--space-6);">
          <label class="form-check" style="margin-bottom: 0;">
            <input type="checkbox" id="remember-me" name="remember" class="form-check-input" />
            <span class="form-check-label text-sm">Remember me</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg btn-full">
          <span>Sign In</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Demo Account Quick Fill Chips -->
      <div class="demo-accounts">
        <span class="text-xs text-muted font-semibold" style="text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: var(--space-2);">
          Quick Demo Accounts
        </span>
        <div class="flex flex-wrap gap-2">
          <button type="button" class="demo-account-chip" data-email="admin@smartlib.com" data-pass="Admin@123">
            👑 Admin
          </button>
          <button type="button" class="demo-account-chip" data-email="librarian@smartlib.com" data-pass="Librarian@123">
            📚 Librarian
          </button>
          <button type="button" class="demo-account-chip" data-email="rahul.sharma@example.com" data-pass="Member@123">
            🎓 Member
          </button>
        </div>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <!-- REQUIRED SHARED JAVASCRIPT MODULES (IN SPECIFIED ORDER) -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/pagination.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/3d-effects.js"></script>
  <script src="../js/navigation.js"></script>

  <!-- PAGE-SPECIFIC CONTROLLER -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect directly to dashboard or redirect param
      if (window.auth && window.auth.isAuthenticated()) {
        redirectAfterLogin();
        return;
      }

      // Restore remembered email if available
      const savedEmail = localStorage.getItem('smartlib_remembered_email');
      const emailInput = document.getElementById('email');
      const rememberCheckbox = document.getElementById('remember-me');
      if (savedEmail && emailInput) {
        emailInput.value = savedEmail;
        if (rememberCheckbox) rememberCheckbox.checked = true;
      }

      // Password toggle show/hide
      setupPasswordToggle();

      // Quick-fill demo account handler
      setupDemoChips();

      // Form submission
      setupLoginForm();
    });

    /**
     * Password Visibility Toggle
     */
    function setupPasswordToggle() {
      const toggleBtn = document.getElementById('toggle-password-btn');
      const passwordInput = document.getElementById('password');
      if (!toggleBtn || !passwordInput) return;

      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleBtn.innerHTML = isPassword
          ? `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`
          : `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
      });
    }

    /**
     * Demo accounts quick-fill
     */
    function setupDemoChips() {
      document.querySelectorAll('.demo-account-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const email = chip.getAttribute('data-email');
          const pass = chip.getAttribute('data-pass');
          const emailInput = document.getElementById('email');
          const passInput = document.getElementById('password');

          if (emailInput && passInput) {
            emailInput.value = email;
            passInput.value = pass;
            if (window.validate) window.validate.clearAllErrors('#login-form');
            if (window.toast) window.toast.info(`Filled credentials for ${chip.textContent.trim()}`);
          }
        });
      });
    }

    /**
     * Form submission with client validation & auth.login
     */
    function setupLoginForm() {
      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('login-submit-btn');
      if (!form || !submitBtn) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const rules = {
          email: { required: true, email: true, requiredMessage: 'Email address is required' },
          password: { required: true, minLength: 6, requiredMessage: 'Password is required' }
        };

        if (window.validate && !window.validate.validateForm(form, rules)) {
          return;
        }

        const email = form.email.value.trim();
        const password = form.password.value;
        const rememberMe = form.remember ? form.remember.checked : false;

        // Remember email preference
        if (rememberMe) {
          localStorage.setItem('smartlib_remembered_email', email);
        } else {
          localStorage.removeItem('smartlib_remembered_email');
        }

        // Set Loading UI
        submitBtn.disabled = true;
        const originalBtnContent = submitBtn.innerHTML;
        submitBtn.innerHTML = `
          <span class="spinner-sm" style="display:inline-block; width:16px; height:16px; border:2px solid #FFF; border-top-color:transparent; border-radius:50%; animation:spin 0.6s linear infinite; margin-right:8px;"></span>
          <span>Authenticating...</span>
        `;

        try {
          await window.auth.login(email, password);
          if (window.toast) {
            window.toast.success('Login successful! Redirecting...', 1800);
          }
          setTimeout(() => {
            redirectAfterLogin();
          }, 800);
        } catch (err) {
          console.error('Login error:', err);
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnContent;

          const errorMsg = err.message || (err.data && err.data.message) || 'Invalid email or password. Please try again.';
          if (window.toast) {
            window.toast.error(errorMsg);
          }
          if (window.validate) {
            window.validate.showFieldError('#password', errorMsg);
          }
        }
      });
    }

    /**
     * Compute post-login destination URL
     */
    function redirectAfterLogin() {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect');

      if (redirectUrl && !redirectUrl.includes('login') && !redirectUrl.includes('register')) {
        window.location.href = redirectUrl;
        return;
      }

      const user = window.auth ? window.auth.getUser() : null;
      if (user) {
        const role = (user.role || '').toUpperCase();
        if (role === 'ADMIN' || role === 'LIBRARIAN') {
          window.location.href = 'admin-dashboard.html';
          return;
        }
      }

      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
