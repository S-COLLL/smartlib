<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Catalog · SMARTLIB</title>
  <meta name="description" content="Browse and search the complete SMARTLIB catalog with category filters, availability tracking, and 3D shelf locations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Books catalog specific styling */
    .catalog-search-bar {
      position: relative;
      margin-bottom: var(--space-6);
    }
    .catalog-search-input {
      width: 100%;
      height: 48px;
      padding-left: 2.85rem;
      padding-right: 1rem;
      border-radius: var(--radius-xl);
      border: 1.5px solid var(--border);
      background-color: var(--surface);
      font-size: var(--text-base);
      color: var(--text);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
    }
    .catalog-search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.15);
    }
    .catalog-search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
    }
    .view-toggle-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .view-toggle-btn.active, .view-toggle-btn:hover {
      background-color: var(--primary-100);
      color: var(--primary-800);
      border-color: var(--primary-300);
    }
    /* List View mode for book cards */
    .books-grid.list-view {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .books-grid.list-view .book-card-3d {
      flex-direction: row;
      align-items: stretch;
      max-height: 200px;
    }
    .books-grid.list-view .book-cover-container {
      width: 140px;
      padding-top: 0;
      flex-shrink: 0;
      height: 100%;
    }
    .books-grid.list-view .book-card-details {
      padding: var(--space-4) var(--space-6);
    }
    .books-grid.list-view .book-card-title {
      font-size: var(--text-lg);
      height: auto;
      margin-bottom: var(--space-1);
    }
    /* Mobile filter drawer toggle */
    .mobile-filter-btn {
      display: none;
    }
    @media (max-width: 991px) {
      .catalog-layout {
        grid-template-columns: 1fr;
      }
      .filter-sidebar {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 320px;
        height: 100vh;
        z-index: 1050;
        overflow-y: auto;
        border-radius: 0;
        box-shadow: var(--shadow-2xl);
      }
      .filter-sidebar.mobile-open {
        display: block;
      }
      .mobile-filter-btn {
        display: inline-flex;
      }
      .mobile-filter-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 1040;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Collapsible Sidebar (Rendered by navigation.js) -->
    <aside id="sidebar"></aside>

    <div class="main-content">
      <!-- Top Header (Rendered by navigation.js) -->
      <header id="top-header"></header>

      <div class="container-fluid" style="padding-top: var(--space-2);">
        <!-- Breadcrumb & Header -->
        <div class="page-header">
          <div class="page-title-group">
            <ul class="breadcrumb">
              <li class="breadcrumb-item"><a href="index.html">Home</a><span class="breadcrumb-separator">/</span></li>
              <li class="breadcrumb-item active" aria-current="page">Book Catalog</li>
            </ul>
            <h1 class="page-title">Library Book Catalog</h1>
            <p class="page-subtitle">Search our curated volumes, inspect shelf locations, and check availability in real time.</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-secondary mobile-filter-btn" id="open-filter-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
              <span>Filters</span>
            </button>
            <a href="library-map.html" class="btn btn-secondary btn-sm">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>
              <span>Library Map</span>
            </a>
          </div>
        </div>

        <!-- Catalog Search Bar -->
        <div class="catalog-search-bar">
          <svg class="catalog-search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input 
            type="search" 
            id="catalog-search-input" 
            class="catalog-search-input" 
            placeholder="Search by title, author name, ISBN, publisher, or subject..." 
            autocomplete="off"
          />
        </div>

        <!-- Catalog Main Two-Column Layout -->
        <div class="catalog-layout">
          <!-- Filters Sidebar -->
          <aside class="filter-sidebar" id="filter-sidebar">
            <div class="flex-between" style="margin-bottom: var(--space-4);">
              <h3 class="font-bold text-base" style="margin: 0;">Refine Search</h3>
              <button class="btn btn-ghost btn-sm" id="clear-all-filters-btn" style="padding: 2px 8px; font-size: 11px;">
                Clear All
              </button>
            </div>

            <!-- Category Filter -->
            <div class="filter-group">
              <label for="filter-category" class="filter-title">Category</label>
              <select id="filter-category" class="form-select">
                <option value="">All Categories</option>
                <!-- Filled dynamically from /categories -->
              </select>
            </div>

            <!-- Availability Filter -->
            <div class="filter-group">
              <div class="filter-title">Stock Availability</div>
              <div class="filter-options">
                <label class="form-check" style="margin-bottom: var(--space-1);">
                  <input type="radio" name="availability-filter" value="" class="form-check-input" checked />
                  <span class="form-check-label">All Items</span>
                </label>
                <label class="form-check" style="margin-bottom: 0;">
                  <input type="radio" name="availability-filter" value="1" class="form-check-input" />
                  <span class="form-check-label">Available Only</span>
                </label>
              </div>
            </div>

            <!-- Floor Filter -->
            <div class="filter-group">
              <label for="filter-floor" class="filter-title">Library Floor</label>
              <select id="filter-floor" class="form-select">
                <option value="">All Floors</option>
                <option value="1">Floor 1 (Ground Hub)</option>
                <option value="2">Floor 2 (Sciences &amp; History)</option>
                <option value="3">Floor 3 (Literature &amp; Quiet Bay)</option>
              </select>
            </div>

            <!-- Sort By -->
            <div class="filter-group">
              <label for="filter-sort" class="filter-title">Sort Catalog</label>
              <select id="filter-sort" class="form-select">
                <option value="relevance">Relevance</option>
                <option value="title_asc">Title: A to Z</option>
                <option value="title_desc">Title: Z to A</option>
                <option value="newest">Newest Additions</option>
                <option value="rating">Highest Rated</option>
              </select>
            </div>

            <div class="d-block d-lg-none" style="margin-top: var(--space-4);">
              <button class="btn btn-primary btn-full btn-sm" id="close-filter-btn">
                Apply &amp; Close
              </button>
            </div>
          </aside>

          <!-- Book Grid & Toolbar Container -->
          <section>
            <!-- Catalog Header Bar -->
            <div class="catalog-header-bar">
              <div class="flex-align-center gap-3">
                <span class="text-sm font-semibold" id="results-count-text" style="color: var(--text);">
                  Showing 0 books
                </span>
                <div id="active-filter-chips" class="active-filters" style="margin-bottom: 0;"></div>
              </div>

              <!-- View Switcher -->
              <div class="flex-align-center gap-2">
                <button class="view-toggle-btn active" id="view-grid-btn" title="Grid View" aria-label="Grid View">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                </button>
                <button class="view-toggle-btn" id="view-list-btn" title="List View" aria-label="List View">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
                </button>
              </div>
            </div>

            <!-- Books Container -->
            <div id="catalog-books-container" class="books-grid">
              <!-- Rendered dynamically -->
            </div>

            <!-- Pagination Container -->
            <div id="catalog-pagination-container" style="margin-top: var(--space-8); display: flex; justify-content: center;">
              <!-- Rendered by pagination.js -->
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- REQUIRED SHARED JAVASCRIPT MODULES (IN SPECIFIED ORDER) -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/pagination.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/3d-effects.js"></script>
  <script src="../js/navigation.js"></script>

  <!-- PAGE-SPECIFIC CONTROLLER -->
  <script>
    // State management for Catalog Page
    const catalogState = {
      search: '',
      category: '',
      available: '',
      floor: '',
      sort: 'relevance',
      page: 1,
      limit: 12,
      view: 'grid'
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (window.navigation) window.navigation.init();

      // Read initial state from URL search params
      readUrlParams();

      // Setup UI controls & filters
      setupFilterControls();
      setupViewToggle();
      setupMobileFilters();
      setupReservationHandler();

      // Populate categories dropdown & fetch books
      loadCategoriesDropdown().then(() => {
        fetchCatalogBooks();
      });
    });

    /**
     * Parse query string into catalogState
     */
    function readUrlParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('search') || params.has('q')) {
        catalogState.search = params.get('search') || params.get('q') || '';
      }
      if (params.has('category')) {
        catalogState.category = params.get('category');
      }
      if (params.has('available')) {
        catalogState.available = params.get('available');
      }
      if (params.has('floor')) {
        catalogState.floor = params.get('floor');
      }
      if (params.has('sort')) {
        catalogState.sort = params.get('sort');
      }
      if (params.has('page')) {
        catalogState.page = parseInt(params.get('page'), 10) || 1;
      }

      // Sync form controls
      const searchInput = document.getElementById('catalog-search-input');
      if (searchInput) searchInput.value = catalogState.search;

      const floorSelect = document.getElementById('filter-floor');
      if (floorSelect && catalogState.floor) floorSelect.value = catalogState.floor;

      const sortSelect = document.getElementById('filter-sort');
      if (sortSelect && catalogState.sort) sortSelect.value = catalogState.sort;

      const availRadios = document.querySelectorAll('input[name="availability-filter"]');
      availRadios.forEach(radio => {
        if (radio.value === catalogState.available) {
          radio.checked = true;
        }
      });
    }

    /**
     * Push current state to browser URL without full reload
     */
    function syncUrlParams() {
      const params = new URLSearchParams();
      if (catalogState.search) params.set('search', catalogState.search);
      if (catalogState.category) params.set('category', catalogState.category);
      if (catalogState.available) params.set('available', catalogState.available);
      if (catalogState.floor) params.set('floor', catalogState.floor);
      if (catalogState.sort && catalogState.sort !== 'relevance') params.set('sort', catalogState.sort);
      if (catalogState.page > 1) params.set('page', catalogState.page);

      const newUrl = `${window.location.pathname}${params.toString() ? '?' + params.toString() : ''}`;
      window.history.replaceState({}, '', newUrl);
    }

    /**
     * Populate categories from GET /categories
     */
    async function loadCategoriesDropdown() {
      const select = document.getElementById('filter-category');
      if (!select) return;

      try {
        const res = await window.api.get('/categories');
        const list = (res && res.data) ? res.data : (Array.isArray(res) ? res : []);

        list.forEach(c => {
          const id = c.category_id || c.id;
          const name = c.category_name || c.name;
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = name;
          if (String(id) === String(catalogState.category)) {
            opt.selected = true;
          }
          select.appendChild(opt);
        });
      } catch (err) {
        console.warn('Failed to load categories dropdown', err);
      }
    }

    /**
     * Setup events for search input, dropdowns, and clear filters
     */
    function setupFilterControls() {
      // Debounced search input
      const searchInput = document.getElementById('catalog-search-input');
      let searchTimer = null;
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            catalogState.search = searchInput.value.trim();
            catalogState.page = 1;
            syncUrlParams();
            fetchCatalogBooks();
          }, 350);
        });

        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            clearTimeout(searchTimer);
            catalogState.search = searchInput.value.trim();
            catalogState.page = 1;
            syncUrlParams();
            fetchCatalogBooks();
          }
        });
      }

      // Category select
      const catSelect = document.getElementById('filter-category');
      if (catSelect) {
        catSelect.addEventListener('change', () => {
          catalogState.category = catSelect.value;
          catalogState.page = 1;
          syncUrlParams();
          fetchCatalogBooks();
        });
      }

      // Availability radios
      document.querySelectorAll('input[name="availability-filter"]').forEach(radio => {
        radio.addEventListener('change', () => {
          catalogState.available = radio.value;
          catalogState.page = 1;
          syncUrlParams();
          fetchCatalogBooks();
        });
      });

      // Floor select
      const floorSelect = document.getElementById('filter-floor');
      if (floorSelect) {
        floorSelect.addEventListener('change', () => {
          catalogState.floor = floorSelect.value;
          catalogState.page = 1;
          syncUrlParams();
          fetchCatalogBooks();
        });
      }

      // Sort select
      const sortSelect = document.getElementById('filter-sort');
      if (sortSelect) {
        sortSelect.addEventListener('change', () => {
          catalogState.sort = sortSelect.value;
          catalogState.page = 1;
          syncUrlParams();
          fetchCatalogBooks();
        });
      }

      // Clear all filters button
      const clearBtn = document.getElementById('clear-all-filters-btn');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          catalogState.search = '';
          catalogState.category = '';
          catalogState.available = '';
          catalogState.floor = '';
          catalogState.sort = 'relevance';
          catalogState.page = 1;

          if (searchInput) searchInput.value = '';
          if (catSelect) catSelect.value = '';
          if (floorSelect) floorSelect.value = '';
          if (sortSelect) sortSelect.value = 'relevance';
          const defaultRadio = document.querySelector('input[name="availability-filter"][value=""]');
          if (defaultRadio) defaultRadio.checked = true;

          syncUrlParams();
          fetchCatalogBooks();
        });
      }
    }

    /**
     * View Switcher (Grid vs List)
     */
    function setupViewToggle() {
      const gridBtn = document.getElementById('view-grid-btn');
      const listBtn = document.getElementById('view-list-btn');
      const container = document.getElementById('catalog-books-container');

      if (!gridBtn || !listBtn || !container) return;

      gridBtn.addEventListener('click', () => {
        gridBtn.classList.add('active');
        listBtn.classList.remove('active');
        container.classList.remove('list-view');
        catalogState.view = 'grid';
      });

      listBtn.addEventListener('click', () => {
        listBtn.classList.add('active');
        gridBtn.classList.remove('active');
        container.classList.add('list-view');
        catalogState.view = 'list';
      });
    }

    /**
     * Mobile filter drawer toggle
     */
    function setupMobileFilters() {
      const openBtn = document.getElementById('open-filter-btn');
      const closeBtn = document.getElementById('close-filter-btn');
      const sidebar = document.getElementById('filter-sidebar');

      if (!openBtn || !sidebar) return;

      let backdrop = null;

      const closeDrawer = () => {
        sidebar.classList.remove('mobile-open');
        if (backdrop && backdrop.parentNode) {
          backdrop.parentNode.removeChild(backdrop);
          backdrop = null;
        }
      };

      openBtn.addEventListener('click', () => {
        sidebar.classList.add('mobile-open');
        backdrop = document.createElement('div');
        backdrop.className = 'mobile-filter-backdrop';
        document.body.appendChild(backdrop);
        backdrop.addEventListener('click', closeDrawer);
      });

      if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
    }

    /**
     * Fetch catalog books from GET /books
     */
    async function fetchCatalogBooks() {
      const container = document.getElementById('catalog-books-container');
      const paginationContainer = document.getElementById('catalog-pagination-container');
      const countEl = document.getElementById('results-count-text');

      if (!container) return;

      // Render loading skeleton
      container.innerHTML = window.components.loadingSkeleton('cards', 8);
      if (paginationContainer) paginationContainer.innerHTML = '';

      const queryParams = {
        search: catalogState.search,
        category: catalogState.category,
        available: catalogState.available,
        floor: catalogState.floor,
        sort: catalogState.sort,
        page: catalogState.page,
        limit: catalogState.limit
      };

      try {
        const res = await window.api.get('/books', queryParams);

        // Defensive extraction for response shapes
        let books = [];
        let totalItems = 0;
        let totalPages = 1;
        let currentPage = catalogState.page;

        if (res && res.data) {
          if (Array.isArray(res.data.books)) {
            books = res.data.books;
            const p = res.data.pagination || {};
            totalPages = p.totalPages || p.pages || Math.ceil((p.total || books.length) / catalogState.limit) || 1;
            totalItems = p.total || p.totalItems || p.totalBooks || books.length;
            currentPage = p.currentPage || p.page || catalogState.page;
          } else if (Array.isArray(res.data)) {
            books = res.data;
            totalItems = books.length;
            totalPages = Math.ceil(totalItems / catalogState.limit) || 1;
          }
        } else if (res && Array.isArray(res.books)) {
          books = res.books;
          const p = res.pagination || {};
          totalPages = p.totalPages || Math.ceil((p.total || books.length) / catalogState.limit) || 1;
          totalItems = p.total || books.length;
        } else if (Array.isArray(res)) {
          books = res;
          totalItems = books.length;
          totalPages = 1;
        }

        // Render count
        if (countEl) {
          countEl.textContent = `Showing ${books.length} of ${totalItems} books`;
        }

        // Render empty state if no books
        if (!books.length) {
          container.innerHTML = window.components.emptyState(
            'book',
            'No Books Found',
            'We couldn\'t find any books matching your query or filter selections. Try clearing your filters.',
            'Clear Filters',
            'javascript:document.getElementById("clear-all-filters-btn").click()'
          );
          return;
        }

        // Render cards
        container.innerHTML = books.map(b => window.components.bookCard(b)).join('');

        // Init 3D tilt effects
        if (window.effects) {
          window.effects.initTiltEffect('.book-card-3d');
          window.effects.initScrollReveal('.card-enter');
        }

        // Render pagination controls
        if (paginationContainer && totalPages > 1) {
          window.pagination.renderPagination(paginationContainer, {
            currentPage: Number(currentPage),
            totalPages: Number(totalPages),
            onPageChange: (newPage) => {
              catalogState.page = newPage;
              syncUrlParams();
              window.scrollTo({ top: 120, behavior: 'smooth' });
              fetchCatalogBooks();
            }
          });
        }
      } catch (err) {
        console.error('Catalog fetch failed:', err);
        container.innerHTML = window.components.emptyState(
          'alert',
          'Catalog Error',
          'Could not load books from the server. Please check your connection and retry.',
          'Retry',
          'javascript:fetchCatalogBooks()'
        );
        if (countEl) countEl.textContent = 'Showing 0 books';
      }
    }

    /**
     * Book Card Reservation / Borrow Action
     */
    function setupReservationHandler() {
      document.addEventListener('click', async (e) => {
        const btn = e.target.closest('.reserve-book-btn');
        if (!btn) return;

        e.preventDefault();
        const bookId = btn.getAttribute('data-id');
        if (!bookId) return;

        if (!window.auth || !window.auth.isAuthenticated()) {
          if (window.toast) {
            window.toast.warning('Please sign in to borrow or reserve books.');
          }
          setTimeout(() => {
            window.location.href = `login.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}`;
          }, 1200);
          return;
        }

        const confirmed = await window.modal.confirm(
          'Reserve Book',
          'Would you like to reserve this copy? You will be notified when it is ready at the circulation desk.'
        );

        if (!confirmed) return;

        btn.disabled = true;
        btn.innerHTML = '<span>Processing...</span>';

        try {
          await window.api.post('/reservations', { book_id: bookId });
          if (window.toast) {
            window.toast.success('Reservation confirmed! View details on your dashboard.');
          }
          btn.innerHTML = '<span>Reserved</span>';
          btn.classList.replace('btn-primary', 'btn-secondary');
        } catch (err) {
          console.error('Reservation failed:', err);
          const msg = err.message || 'Unable to place reservation at this time.';
          if (window.toast) window.toast.error(msg);
          btn.disabled = false;
          btn.innerHTML = '<span>Reserve</span>';
        }
      });
    }
  </script>
</body>
</html>
